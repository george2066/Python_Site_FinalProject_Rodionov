<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Barter</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        .top-right-buttons {
            float: right;
            padding: 10px 10px 10px 10px;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-right-buttons">
            {% if user.is_authenticated %}
                <a href="/accounts/logout" class="btn btn-outline-danger">Log Out</a>  {# Use your logout URL #}
            {% else %}
                <a href="/accounts/login/" class="btn btn-outline-primary">Log In</a>  {# Use your login URL #}
                <a href="/accounts/signup/" class="btn btn-outline-success">Register</a> {# Use your register URL #}
            {% endif %}
        </div>

        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
