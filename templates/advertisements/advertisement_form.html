{% extends 'base.html' %}

{% block content %}
<h3>{{ title }}</h3>
<div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
      <label for="id_city">Город:</label>
      <input type="text" name="city" id="id_city" value="{{ form.initial.city }}">
    </p>
    <p>
      <label for="id_street">Улица:</label>
      <input type="text" name="street" id="id_street" value="{{ form.initial.street }}">
    </p>
    <p>
      <label for="id_house">Дом:</label>
      <input type="text" name="house" id="id_house" value="{{ form.initial.house }}">
    </p>

    <input value="Submit" type="submit">
    <input value="Cancel" type="button" onclick="location.href='{% url "advertisements" %}'">
  </form>
</div>
{% endblock %}
