{% extends 'base.html' %}

{% block content %}
<img src="{{ object.image_url }}" width="300" height="200" alt="image">
<div>
    <p>Title: {{ object.title }}        </p>
    <p>Owner: {{ object.owner }}         </p>
    <p>Category: {{ object.category }}     </p>
    <p>Description: {{ object.description }}  </p>
</div>
{% if request.user == object.author %}
<p>
    <input value="Update advertisement" type="button" onclick="location.href='{% url "advertisement-update" object.id %}'"/>
</p>
<p>
    <input value="Delete advertisement" type="button" onclick="location.href='{% url "advertisement-delete" object.id %}'"/>
</p>
{% endif %}
<input value="Cancel" type="button" onclick="location.href='{% url "advertisements" %}'">
{% endblock %}
