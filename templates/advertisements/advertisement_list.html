{% extends 'base.html' %}

{% block content %}

{% if object_list %}
<h3>All my advertisements</h3>
<ul>
    {% for advertisement in object_list %}
    <li>
        <a href="{% url 'advertisement' advertisement.id %}" role="button">
            {{ advertisement.title }}
        </a>
    </li>
    {% endfor %}
</ul>
{% else %}
<h3>You haven`t advertisement</h3>
{% endif %}

{% endblock %}
